  macos-build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            macos: 13
          # - arch: x86_64
          #  macos: 13
    runs-on: macos-${{ matrix.macos }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install pkg-config with Homebrew
      run: |
        brew install pkg-config mingw-w64 sccache llvm
        echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
    - name: sccache setup
      run: |
        echo "RUSTC_WRAPPER=$(which sccache)" >> $GITHUB_ENV
    - name: Build
      run: cargo build --release --bin openvaf-r
    - name: Run tests
      run: cargo test --release
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-macos-${{ matrix.arch }}
        path: target/release/openvaf-r

  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ubuntu-build-test, macos-build-test]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # Download to a directory named "artifacts"
      
      - name: List downloaded files
        run: ls -R artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/* # Upload all files from all subdirectories
          generate_release_notes: true # Automatically create release notes from commits