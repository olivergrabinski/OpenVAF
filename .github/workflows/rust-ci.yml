name: Rust CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Check code formatting
      run: cargo fmt -- --check

  machete:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-machete
      run: cargo install cargo-machete
    - name: Run cargo machete
      run: cargo machete

  ubuntu-build-test:
    runs-on: ubuntu-latest
    needs: [machete]
    steps:
    - uses: actions/checkout@v4
    - name: Install LLVM 15 and Windows cross-compilation tools
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 15
        sudo apt-get install -y llvm-15 llvm-15-dev libclang-15-dev
        
        # Install llvm-lib for Windows cross-compilation
        sudo apt-get install -y mingw-w64
        
        # Create symlink for llvm-lib
        sudo ln -s /usr/bin/llvm-ar-15 /usr/local/bin/llvm-lib
        
        # Verify installation
        which llvm-lib
        llvm-lib --version
    - name: Set LLVM environment variables
      run: |
        # echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-15" >> $GITHUB_ENV
        echo "CLANG_PATH=/usr/lib/llvm-15/bin/clang" >> $GITHUB_ENV
        echo "PATH=/usr/lib/llvm-15/bin:$PATH" >> $GITHUB_ENV
        echo "RUST_BACKTRACE=1" >> $GITHUB_ENV
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    - name: Build
      run: cargo build --release
    - name: Run tests
      run: cargo test --release
